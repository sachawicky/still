name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select validated Xcode
        run: |
          if [ -d /Applications/Xcode_27.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          fi
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 27' || { echo 'Xcode 27 is required for native icon compilation'; exit 1; }
          swift --version
      - name: Tests
        run: swift run StillCheck
      - name: Focus unit and integration configuration tests
        run: |
          swift test
          python3 Scripts/test-focus-hooks.py
      - name: Shell and metadata validation
        run: |
          for script in Scripts/*.sh; do bash -n "$script"; done
          plutil -lint Support/Info.plist Support/PrivacyInfo.xcprivacy
          git diff --check
      - name: Release build and bundle audit
        run: ./Scripts/build-release.sh
